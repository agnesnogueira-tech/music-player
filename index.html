<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel= "stylesheet" href="style.css">
</head>
<body>
    <div class="music-container">
        <h1 id="music-title">Music</h1>
        <img id='cover' alt = "music cover"></img>
        <audio id= 'audio'></audio>
        <div id="below-cover">
            <div id="song-info">
                <div id="song-name">musica</div>
                <div id="artista-name" class="light-color">artista</div>
            </div>
            <button id="save" class="button"><i class="bi bi-bookmark"></i></button>
        </div>
        <div id="progress-bar">
            <div id="current-progress"></div>
        </div>
        <div id="button-container">
            <button id="shuffle" class="button"><i class="bi bi-shuffle"></i></button>
            <button id="return" class="button button-navigate"><i class="bi bi-skip-start-fill"></i></button>
            <button id="play" class="button button-navigate"><i class="bi bi-play-circle-fill"></i></button>
            <button id="next" class="button button-navigate"><i class="bi bi-skip-end-fill"></i></button>
            <button id="repeat" class="button"><i class="bi bi-repeat"></i></button>
        </div>
    </div>
    <script src= "/script.js"></script>
</body>
</html>
